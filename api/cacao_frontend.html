<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Deficiencias en Cacao</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #5a67d8;
        }

        .upload-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #555;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .preview-container {
            margin: 20px 0;
            display: none;
        }

        .preview-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .result-container {
            margin-top: 30px;
            display: none;
        }

        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 18px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .result-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-confidence {
            font-size: 16px;
            opacity: 0.9;
        }

        .probabilities {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
        }

        .prob-title {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .prob-item {
            margin-bottom: 12px;
        }

        .prob-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }

        .prob-bar-container {
            background: #e0e0e0;
            height: 25px;
            border-radius: 12px;
            overflow: hidden;
        }

        .prob-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌿 Detector de Deficiencias en Cacao</h1>
        <p class="subtitle">Sube una imagen de una hoja de cacao para detectar deficiencias nutricionales</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Haz clic o arrastra una imagen aquí</div>
            <div class="upload-hint">Formatos soportados: JPG, JPEG, PNG</div>
            <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png">
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="previewImage" class="preview-image" alt="Preview">
        </div>

        <button class="btn" id="analyzeBtn" disabled>Analizar Imagen</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Analizando imagen...</div>
        </div>

        <div class="error" id="error"></div>

        <div class="result-container" id="resultContainer">
            <div class="result-card">
                <div class="result-title">Deficiencia Detectada</div>
                <div class="result-value" id="resultValue">-</div>
                <div class="result-confidence" id="resultConfidence">-</div>
            </div>

            <div class="probabilities">
                <div class="prob-title">📊 Probabilidades Detalladas</div>
                <div class="prob-item">
                    <div class="prob-label">
                        <span>Potasio</span>
                        <span id="probPotasio">0%</span>
                    </div>
                    <div class="prob-bar-container">
                        <div class="prob-bar" id="barPotasio" style="width: 0%"></div>
                    </div>
                </div>
                <div class="prob-item">
                    <div class="prob-label">
                        <span>Nitrógeno</span>
                        <span id="probNitrogeno">0%</span>
                    </div>
                    <div class="prob-bar-container">
                        <div class="prob-bar" id="barNitrogeno" style="width: 0%"></div>
                    </div>
                </div>
                <div class="prob-item">
                    <div class="prob-label">
                        <span>Fósforo</span>
                        <span id="probFosforo">0%</span>
                    </div>
                    <div class="prob-bar-container">
                        <div class="prob-bar" id="barFosforo" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const resultContainer = document.getElementById('resultContainer');

        let selectedFile = null;

        // Click en área de carga
        uploadArea.addEventListener('click', () => fileInput.click());

        // Selección de archivo
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // Manejar archivo
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Por favor selecciona una imagen válida');
                return;
            }

            selectedFile = file;
            
            // Mostrar preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.style.display = 'block';
                analyzeBtn.disabled = false;
                resultContainer.style.display = 'none';
                errorDiv.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // Analizar imagen
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            loading.style.display = 'block';
            resultContainer.style.display = 'none';
            errorDiv.style.display = 'none';
            analyzeBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    displayResults(result.data);
                } else {
                    showError('Error al procesar la imagen');
                }
            } catch (error) {
                showError('Error de conexión. Asegúrate de que la API esté ejecutándose en http://localhost:8000');
                console.error(error);
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        });

        // Mostrar resultados
        function displayResults(data) {
            document.getElementById('resultValue').textContent = data.deficiencia;
            document.getElementById('resultConfidence').textContent = `Confianza: ${data.confianza}%`;

            // Actualizar probabilidades
            document.getElementById('probPotasio').textContent = `${data.probabilidades.Potasio}%`;
            document.getElementById('probNitrogeno').textContent = `${data.probabilidades.Nitrogeno}%`;
            document.getElementById('probFosforo').textContent = `${data.probabilidades.Fosforo}%`;

            document.getElementById('barPotasio').style.width = `${data.probabilidades.Potasio}%`;
            document.getElementById('barNitrogeno').style.width = `${data.probabilidades.Nitrogeno}%`;
            document.getElementById('barFosforo').style.width = `${data.probabilidades.Fosforo}%`;

            resultContainer.style.display = 'block';
        }

        // Mostrar error
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
